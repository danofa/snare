<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snare Scribe</title>
<style>
:root{--bg:#eceef3;--fg:#1b1e24;--mut:#6b7280;--pn:#fff;--pn2:#f4f5f8;--bd:#d8dbe3;--ac:#4f46e5;--acfg:#fff;--ac2:#e9e8ff;--dg:#dc2626;--sh:0 1px 2px rgba(16,24,40,.07),0 6px 18px rgba(16,24,40,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121419;--fg:#e9ebf0;--mut:#98a0ae;--pn:#1c1f26;--pn2:#262a33;--bd:#323744;--ac:#8d88ff;--acfg:#13141b;--ac2:#2b2a55;--dg:#ff6b6b;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#121419;--fg:#e9ebf0;--mut:#98a0ae;--pn:#1c1f26;--pn2:#262a33;--bd:#323744;--ac:#8d88ff;--acfg:#13141b;--ac2:#2b2a55;--dg:#ff6b6b;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--pn) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.logo i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ac);color:var(--acfg);font-size:16px}
.grow{flex:1}
button,select,input{font:inherit;color:var(--fg)}
button,select,input[type=number],input[type=text]{height:32px;background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:0 11px;transition:background .12s,border-color .12s,transform .05s}
button{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,select:hover{border-color:var(--ac)}button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button.primary{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600;padding:0 16px;height:34px}
button.primary.on{background:var(--dg);border-color:var(--dg);color:#fff}
button.danger:hover{border-color:var(--dg);color:var(--dg)}
kbd{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 5px;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);opacity:.8}
input[type=number]{width:64px}input[type=text]{width:170px}
.fld{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.chip{position:relative;display:inline-flex}.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.chip span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--pn2);color:var(--fg)}
.chip input:checked+span{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--ac);outline-offset:1px}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;height:32px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--pn2)}
.menu summary::-webkit-details-marker{display:none}.menu .mb{position:absolute;right:0;top:38px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);min-width:170px}
#ui{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,56px));z-index:15;background:var(--bg);max-width:1180px;margin:0 auto;padding:12px 16px 8px}
@media (max-height:560px){#ui{position:static}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--pn2);border:1px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0;width:fit-content;max-width:100%}
.tab{border:0;background:transparent;height:30px;border-radius:8px;padding:0 16px;font-weight:600;color:var(--mut)}
.tab:hover{color:var(--fg)}.tab.act{background:var(--pn);color:var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.14)}
#ui .grp{border-radius:0 14px 14px 14px;padding:14px 16px}#ui .grp[hidden]{display:none}
.grp{min-width:0;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:10px 12px 12px;box-shadow:var(--sh)}
.gt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.gb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;max-width:100%}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button:hover{position:relative;z-index:1}
.mb hr{border:0;border-top:1px solid var(--bd);width:100%;margin:2px 0}.mb button{justify-content:space-between}
#cm{display:none;position:fixed;z-index:50;min-width:240px;padding:6px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh)}
#cm button{display:flex;width:100%;justify-content:space-between;height:30px;border:0;background:transparent;border-radius:7px;padding:0 10px}
#cm button:hover:not(:disabled){background:var(--ac2);color:var(--ac)}#cm button:disabled{opacity:.4;cursor:default}
#cm hr{border:0;border-top:1px solid var(--bd);margin:5px 4px}
.hint{font-size:12px;color:var(--mut);flex-basis:100%}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.psep{width:1px;height:38px;background:var(--bd);margin:0 4px}
.nb{position:relative;flex-direction:column;justify-content:center;width:50px;height:56px;padding:0}
.nb svg{width:22px;height:30px;pointer-events:none}.nb.t svg{height:24px}
.nb kbd{position:absolute;right:3px;bottom:3px;font-size:9px;padding:2px 4px}
#side{display:none}
body.side #wrap{display:grid;grid-template-columns:auto minmax(0,1fr);max-width:1400px;margin:0 auto}
body.side #side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,56px) + var(--uh,0px) + 10px);align-self:start;margin:14px 0 0 14px;padding:8px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);max-height:calc(100vh - var(--hh,56px) - var(--uh,0px) - 30px);overflow:auto}
#side .pal{flex-direction:column;flex-wrap:nowrap}#side .psep{width:100%;height:1px;margin:2px 0}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(94vw,980px);padding:8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12.5px;box-shadow:var(--sh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{padding:22px 12px 90px;display:flex;flex-direction:column;align-items:center;gap:22px}
svg.page{background:#fff;width:min(100%,920px);height:auto;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 12px 34px rgba(0,0,0,.18)}
.hit{fill:transparent;cursor:pointer}.hit.sel{fill:rgba(79,70,229,.24)}.hit.play{fill:rgba(255,140,0,.45)}
.mr{fill:transparent;cursor:pointer}.mr.cur{fill:rgba(79,70,229,.06)}.mr.under{fill:rgba(255,190,0,.15)}.mr.over{fill:rgba(255,60,60,.17)}
@media (max-width:640px){header{padding:8px 10px}.logo span{display:none}#st{white-space:normal;border-radius:14px;width:94vw}}
@media print{header,#ui,#st,#cm,#side{display:none!important}body{background:#fff}#score{padding:0;gap:0}svg.page{box-shadow:none;border-radius:0;width:100%;page-break-after:always;break-after:page}.hit,.mr{display:none}}
</style>
</head><body>
<header><div class="logo"><i>🥁</i><span>Snare Scribe</span></div><div id="hdr" style="display:contents"></div></header>
<div id="ui"></div>
<div id="st"></div>
<div id="wrap"><aside id="side" aria-label="Notes toolbar"></aside><div id="score"></div></div>
<script>
const $=id=>document.getElementById(id),el=(t,p={},c=[])=>{const n=Object.assign(document.createElement(t),p);c.forEach(x=>n.append(x));return n};
const mk=(ts=[4,4])=>({ts:ts.slice(),rs:0,re:0,ev:[]});
const ev=(d,o={})=>Object.assign({d,dots:0,rest:0,tup:0,acc:0,gh:0,gr:0,roll:0,st:'',x:0},o);
const TR={3:2,5:4,6:4,7:4},EPS=1e-9;
const act=e=>(1/e.d)*(2-1/2**e.dots)*(e.tup?TR[e.tup]/e.tup:1);
const fill=m=>m.ev.reduce((a,e)=>a+act(e),0),cap=m=>m.ts[0]/m.ts[1];
const nbOf=e=>e.rest||e.d<8?0:e.d==8?1:e.d==16?2:3;
let S,sel={m:0,i:null,j:null},ent={rest:0,dot:0,tup:0},undo=[],redo=[],hist='';
try{S=JSON.parse(localStorage.getItem('snare-scribe'))}catch(e){}
if(!S||!S.ms)S={title:'Untitled',bpm:120,mpl:4,ms:[mk(),mk(),mk(),mk()]};
const snap=()=>JSON.stringify(S);
function push(){stop();undo.push(snap());if(undo.length>100)undo.shift();redo=[]}
function commit(){try{localStorage.setItem('snare-scribe',snap())}catch(e){}draw();status()}
let CONV='';
function fromDesktop(o){CONV='';if(o&&o.score&&!o.ms)o=o.score;if(!o||o.ms||!Array.isArray(o.measures))return o;
 const lost=new Set();
 const r={title:o.title||'Untitled',bpm:+o.tempo||120,mpl:o.mpl??4,ms:o.measures.map(m=>{if(m.label)lost.add('bar labels');
  return{ts:m.ts||[4,4],rs:+!!m.rep_start,re:+!!m.rep_end,ev:(m.events||[]).map(e=>{
   if(e.marcato||e.staccato||e.tenuto)lost.add('marcato/staccato/tenuto');if(e.dyn)lost.add('dynamics');if(e.text)lost.add('text marks');if(e.tie)lost.add('ties');if(e.head=='rim')lost.add('circled heads');
   return{d:e.dur||4,dots:e.dots||0,rest:+!!e.rest,tup:e.tup||0,acc:+!!e.accent,gh:+!!e.ghost,gr:e.grace||0,roll:e.roll||0,st:e.sticking||'',x:+(e.head=='x')}})}})};
 CONV=' (converted from the desktop app'+(lost.size?'; not supported here yet: '+[...lost].join(', '):'')+')';return r}
function load(j){stop();const o=fromDesktop(JSON.parse(j));if(!o||!Array.isArray(o.ms)||!o.ms.length)throw new Error('bad score');
 o.ms.forEach(m=>{m.ts=Array.isArray(m.ts)?m.ts:[4,4];m.rs=+!!m.rs;m.re=+!!m.re;m.ev=(m.ev||[]).map(e=>ev(e.d||4,e))});o.title=o.title||'';o.bpm=+o.bpm||120;o.mpl=o.mpl??4;
 S=o;sel={m:Math.min(sel.m,S.ms.length-1),i:null,j:null};commit();syncInputs()}

/* ---------- analysis ---------- */
function an(m){const E=m.ev,t=[],gid=[],groups=[];let c=0;E.forEach(e=>{t.push(c);c+=act(e);gid.push(-1)});
 for(let i=0;i<E.length;){if(E[i].tup){const n=E[i].tup,g=[];while(i<E.length&&E[i].tup==n&&g.length<n)g.push(i++);groups.push(g);g.forEach(k=>gid[k]=groups.length-1)}else i++}
 const[nu,de]=m.ts;let bl=1/de;if(de==8&&nu%3==0&&nu>=6)bl=3/8;
 const beams=[];let cur=[],key=null;const fl=()=>{if(cur.length>1)beams.push(cur);cur=[];key=null};
 E.forEach((e,i)=>{if(!nbOf(e)){fl();return}const k=e.tup?'t'+gid[i]:'b'+Math.floor(t[i]/bl+EPS);if(cur.length&&k!=key)fl();cur.push(i);key=k});fl();
 const bg=E.map(()=>-1);beams.forEach((g,b)=>g.forEach(k=>bg[k]=b));
 return{t,gid,groups,beams,bg}}

/* ---------- engraving (SVG) ---------- */
const s=7,W=820,H=1160,MX=32,AV=W-2*MX,ABOVE=6.4*s,BELOW=5.4*s;
const f=n=>Math.round(n*100)/100;
const Ln=(x1,y1,x2,y2,w=1)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#000" stroke-width="${f(w)}"/>`;
const Rc=(x,y,w,h)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="#000"/>`;
const Pa=(d,w=1,fl='none')=>`<path d="${d}" stroke="#000" stroke-width="${f(w)}" fill="${fl}" stroke-linecap="round" stroke-linejoin="round"/>`;
const El=(x,y,rx,ry,r=-22,fl='#000',sw=0)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" transform="rotate(${r} ${f(x)} ${f(y)})" fill="${fl}" stroke="#000" stroke-width="${sw}"/>`;
const Tx=(x,y,t,sz,st='',a='middle')=>`<text x="${f(x)}" y="${f(y)}" font-family="Arial,Helvetica,sans-serif" font-size="${f(sz)}" text-anchor="${a}" ${st.includes('b')?'font-weight="bold"':''} ${st.includes('i')?'font-style="italic"':''}>${t}</text>`;
const tsShown=i=>i==0||S.ms[i].ts[0]!=S.ms[i-1].ts[0]||S.ms[i].ts[1]!=S.ms[i-1].ts[1];
const gl=e=>e.gr&&!e.rest?2.4*s+(e.gr-1)*1.25*s:0;
const base=e=>s*(1.8+2*Math.sqrt(act(e)*16))+e.dots*.9*s+gl(e)+(e.gh?1.1*s:0);
const fixed=(i,first)=>.9*s+(S.ms[i].rs?1.4*s:0)+(first?2.6*s:0)+(tsShown(i)?2.6*s:0)+.9*s+(S.ms[i].re?1.4*s:0);
const scal=i=>S.ms[i].ev.length?S.ms[i].ev.reduce((a,e)=>a+base(e)-gl(e),0):6*s;
const glt=i=>S.ms[i].ev.reduce((a,e)=>a+gl(e),0);

function restGlyph(cx,yt,d){const c=yt+2*s;
 if(d==1)return Rc(cx-.8*s,yt+s,1.6*s,.5*s);if(d==2)return Rc(cx-.8*s,c-.5*s,1.6*s,.5*s);
 if(d==4)return Pa(`M${cx+.3*s} ${c-1.5*s}L${cx-.35*s} ${c-.8*s}L${cx+.4*s} ${c}L${cx-.35*s} ${c+.75*s}L${cx+.35*s} ${c+.9*s}L${cx-.1*s} ${c+1.3*s}L${cx-.4*s} ${c+1.65*s}`,.38*s);
 const n=d==8?1:d==16?2:3;let o=Ln(cx+.55*s,c-s,cx-.35*s,c+(1+.9*(n-1))*s,.2*s);
 for(let k=0;k<n;k++)o+=El(cx-.1*s,c+(-.45+.9*k)*s,.33*s,.33*s,0);return o}

function draw(){
 const ms=S.ms,A=ms.map(an),[bl,bh]=bars();let pages=[],cur='',y=0,first=true,lineNo=0;
 const header=()=>{let o=Tx(W/2,36,S.title||'',24,'b');o+=Tx(MX,62,`♩ = ${S.bpm}`,12,'','start');return o};
 const lines=[];let ln=[];const nat=a=>a.reduce((t,i,k)=>t+fixed(i,k==0)+scal(i)+glt(i),0);
 ms.forEach((m,i)=>{if(ln.length&&((S.mpl>0&&ln.length>=S.mpl)||nat(ln.concat(i))>AV)){lines.push(ln);ln=[]}ln.push(i)});if(ln.length)lines.push(ln);
 y=76;
 lines.forEach((line,li)=>{
  if(y+ABOVE+4*s+BELOW>H-30&&y>80){pages.push(cur);cur='';y=40;first=false}
  const yt=y+ABOVE,last=li==lines.length-1;let fx=0,sc=0;line.forEach((i,k)=>{fx+=fixed(i,k==0)+glt(i);sc+=scal(i)});
  let scale=(!last||fx+sc>=.55*AV)?(AV-fx)/sc:1;scale=Math.max(.75,scale);
  let x=MX,out='',under='';
  line.forEach((i,k)=>{const m=ms[i],a=A[i],xm=x;let cx0=x;
   if(m.rs){out+=Rc(xm,yt,.45*s,4*s)+Ln(xm+.8*s,yt,xm+.8*s,yt+4*s)+El(xm+1.3*s,yt+1.5*s,.2*s,.2*s,0)+El(xm+1.3*s,yt+2.5*s,.2*s,.2*s,0);cx0+=1.4*s}
   else if(k==0)out+=Ln(xm,yt,xm,yt+4*s);
   if(k==0){out+=Rc(cx0+.4*s,yt+s,.45*s,2*s)+Rc(cx0+1.2*s,yt+s,.45*s,2*s);cx0+=2.6*s}
   if(tsShown(i)){out+=Tx(cx0+.9*s,yt+1.95*s,m.ts[0],2.7*s,'b')+Tx(cx0+.9*s,yt+3.95*s,m.ts[1],2.7*s,'b');cx0+=2.6*s}
   cx0+=.9*s;let ex=cx0;const recs=[];
   if(!m.ev.length){const w=6*s*scale;out+=Rc(ex+w/2-.8*s,yt+s,1.6*s,.5*s);ex+=w}
   else{m.ev.forEach(e=>{const g=gl(e),w=g+(base(e)-g)*scale;recs.push({x0:ex,w,cx:ex+g+.95*s+(e.gh?.5*s:0)});ex+=w});out+=events(m,a,recs,yt,i)}
   const xe=ex+.9*s+(m.re?1.4*s:0),last2=last&&k==line.length-1&&i==ms.length-1,nrs=k+1<line.length&&ms[line[k+1]].rs;
   if(m.re){out+=Rc(xe-.45*s,yt,.45*s,4*s)+Ln(xe-.8*s,yt,xe-.8*s,yt+4*s)+El(xe-1.3*s,yt+1.5*s,.2*s,.2*s,0)+El(xe-1.3*s,yt+2.5*s,.2*s,.2*s,0);if((m.rc||2)>2)out+=Tx(xe-.2*s,yt-.9*s,'×'+m.rc,1.5*s,'b','end')}
   else if(last2)out+=Rc(xe-.45*s,yt,.45*s,4*s)+Ln(xe-.9*s,yt,xe-.9*s,yt+4*s);
   else if(!nrs)out+=Ln(xe,yt,xe,yt+4*s);
   const cls=(fill(m)>cap(m)+EPS?'over':(m.ev.length&&fill(m)<cap(m)-EPS?'under':''))+(i>=bl&&i<=bh?' cur':'');
   under+=`<rect class="mr ${cls}" data-m="${i}" x="${f(xm)}" y="${f(yt-ABOVE+3)}" width="${f(xe-xm)}" height="${f(ABOVE+4*s+BELOW-6)}"/>`;
   recs.forEach((r,ei)=>{out+=`<rect class="hit${(i==sel.m&&inSel(ei))?' sel':''}" data-k="${i},${ei}" x="${f(r.x0)}" y="${f(yt-ABOVE+3)}" width="${f(r.w)}" height="${f(ABOVE+4*s+BELOW-6)}"/>`});
   x=xe});
  let stf='';for(let k=0;k<5;k++)stf+=Ln(MX,yt+k*s,x,yt+k*s,.6);
  if(li>0)out+=Tx(MX,yt-.9*s,line[0]+1,1.3*s,'i','start');
  cur+=under+stf+out;y=yt+4*s+BELOW+.6*s});
 pages.push(cur);
 $('score').innerHTML=pages.map((p,n)=>`<svg class="page" viewBox="0 0 ${W} ${H}">${n==0?header():''}${p}${pages.length>1?Tx(W/2,H-20,`${n+1} / ${pages.length}`,9):''}</svg>`).join('')}

function events(m,a,recs,yt,mi){let o='',ny=yt+1.5*s;const E=m.ev,tops=[];
 a.beams.forEach(g=>{const nb=Math.max(...g.map(k=>nbOf(E[k]))),rl=Math.max(...g.map(k=>E[k].roll)),h=Math.max(3.4*s+.4*s*(nb-1),rl?(.5*s+.8*s*(nb-1)+.8*s+(rl-1)*.6*s+1.7*s):0);g.forEach(k=>tops[k]=ny-h)});
 E.forEach((e,i)=>{if(tops[i]!=null)return;const nb=nbOf(e);tops[i]=e.rest?ny-3.4*s:e.d==1?ny-(1.5*s+.55*s*e.roll):ny-Math.max(3.4*s+.4*s*Math.max(0,nb-1),e.roll?4.6*s+.8*s*nb:0)});
 E.forEach((e,i)=>{const r=recs[i],cx=r.cx,top=tops[i],nb=nbOf(e);let sx=cx;
  if(e.rest){o+=restGlyph(cx,yt,e.d);for(let d=0;d<e.dots;d++)o+=El(cx+1.1*s+d*.7*s,yt+1.5*s,.2*s,.2*s,0)}
  else{let off;
   if(e.x){const d=.6*s;o+=Ln(cx-d,ny-d*.85,cx+d,ny+d*.85,1.2)+Ln(cx-d,ny+d*.85,cx+d,ny-d*.85,1.2);off=d}
   else if(e.d==1){o+=El(cx,ny,.95*s,.5*s,0,'#fff',1.2);off=.9*s}
   else{o+=El(cx,ny,.68*s,.5*s,-22,e.d==2?'#fff':'#000',e.d==2?1.2:0);off=.68*s}
   sx=cx+off-.5;r.sx=sx;
   if(e.d>=2)o+=Ln(sx,ny-.1*s,sx,top,.9);
